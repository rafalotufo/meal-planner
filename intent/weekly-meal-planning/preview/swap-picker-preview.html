<div id="meal-swap-preview" class="viz-dotted-background">
  <style>
    #meal-swap-preview { --mp-paper:light-dark(#ffffff,#202824); --mp-ink:light-dark(#292524,#f5f5f4); --mp-muted:light-dark(#66635d,#b9c2bc); --mp-line:light-dark(#e7e5e4,#424e46); --mp-green:light-dark(#064e3b,#a7f3d0); --mp-action:light-dark(#064e3b,#a7f3d0); --mp-on-action:light-dark(#ffffff,#063b2b); --mp-soft:light-dark(#f0f7f2,#293e31); --mp-hover:light-dark(#fafaf9,#29332c); padding:24px 12px; color:var(--mp-ink); font:15px/1.5 system-ui,sans-serif; }
    #meal-swap-preview * { box-sizing:border-box; }
    #meal-swap-preview [hidden] { display:none !important; }
    #meal-swap-preview .mp-dialog { width:100%; max-width:700px; margin:auto; border:1px solid var(--mp-line); border-radius:18px; background:var(--mp-paper); box-shadow:0 18px 55px light-dark(#17251b24,#00000055); overflow:hidden; }
    #meal-swap-preview .mp-head { padding:25px 26px 20px; display:flex; align-items:flex-start; gap:18px; }
    #meal-swap-preview .mp-heading { flex:1; min-width:0; }
    #meal-swap-preview .mp-eyebrow { color:var(--mp-green); font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; margin:0 0 8px; }
    #meal-swap-preview h2 { font:400 29px/1.15 Georgia,serif; letter-spacing:-.025em; margin:0; color:var(--mp-ink); }
    #meal-swap-preview .mp-subtitle { color:var(--mp-muted); margin:9px 0 0; font-size:13px; }
    #meal-swap-preview button { font:inherit; cursor:inherit; }
    #meal-swap-preview button:focus-visible { outline:3px solid var(--mp-green); outline-offset:4px; }
    #meal-swap-preview .mp-close { flex:none; display:grid; place-items:center; width:40px; height:40px; border:1px solid var(--mp-line); border-radius:50%; background:var(--mp-paper); color:var(--mp-muted); }
    #meal-swap-preview .mp-body { padding:0 26px 25px; }
    #meal-swap-preview .mp-search-label { display:block; margin:0 0 7px; font-size:13px; font-weight:500; }
    #meal-swap-preview .mp-search-wrap { position:relative; margin-bottom:14px; }
    #meal-swap-preview .mp-search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--mp-muted); pointer-events:none; }
    #meal-swap-preview .mp-search { display:block; width:100%; min-width:0; min-height:46px; padding:11px 13px 11px 40px; border:1px solid var(--mp-line); border-radius:9px; background:var(--mp-paper); color:var(--mp-ink); font:inherit; font-size:16px; }
    #meal-swap-preview .mp-search::placeholder { color:var(--mp-muted); }
    #meal-swap-preview .mp-search:focus-visible { outline:2px solid var(--mp-green); outline-offset:2px; }
    #meal-swap-preview .mp-results-bar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px 14px; margin:0 0 15px; color:var(--mp-muted); font-size:12px; }
    #meal-swap-preview .mp-hint, #meal-swap-preview .mp-count { margin:0; }
    #meal-swap-preview .mp-count { color:var(--mp-ink); }
    #meal-swap-preview .mp-empty { padding:28px 12px; text-align:center; }
    #meal-swap-preview .mp-empty-title { margin:0 0 6px; font:400 21px/1.3 Georgia,serif; }
    #meal-swap-preview .mp-empty-copy { margin:0 0 16px; color:var(--mp-muted); font-size:13px; }
    #meal-swap-preview .mp-choices { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    #meal-swap-preview .mp-choice { position:relative; display:flex; flex-direction:column; text-align:left; min-width:0; padding:0; overflow:hidden; border:1px solid var(--mp-line); border-radius:12px; background:var(--mp-paper); color:var(--mp-ink); }
    #meal-swap-preview .mp-choice:hover { background:var(--mp-hover); border-color:var(--mp-green); }
    #meal-swap-preview .mp-choice[aria-pressed="true"] { border:2px solid var(--mp-green); background:var(--mp-soft); }
    #meal-swap-preview .mp-photo { display:block; width:100%; aspect-ratio:4/3; overflow:hidden; background:var(--mp-hover); }
    #meal-swap-preview .mp-photo img { width:100%; height:100%; display:block; object-fit:cover; }
    #meal-swap-preview .mp-name { padding:15px 13px 18px; font:400 19px/1.3 Georgia,serif; overflow-wrap:anywhere; }
    #meal-swap-preview .mp-picked { position:absolute; right:8px; top:8px; padding:4px 8px; border-radius:20px; background:var(--mp-action); color:var(--mp-on-action); font-size:11px; font-weight:500; }
    #meal-swap-preview .mp-choice:not([aria-pressed="true"]) .mp-picked { display:none; }
    #meal-swap-preview .mp-footer { padding:19px 26px; border-top:1px solid var(--mp-line); display:flex; flex-wrap:wrap; gap:15px; align-items:center; justify-content:space-between; }
    #meal-swap-preview .mp-selection { flex:1 1 190px; min-width:0; color:var(--mp-muted); font-size:12px; margin:0; }
    #meal-swap-preview .mp-selection strong { color:var(--mp-ink); font-weight:500; }
    #meal-swap-preview .mp-actions { display:flex; gap:9px; }
    #meal-swap-preview .mp-button { min-height:44px; padding:10px 16px; border:1px solid var(--mp-line); border-radius:9px; color:var(--mp-ink); background:var(--mp-paper); font-size:13px; font-weight:500; }
    #meal-swap-preview .mp-primary { border-color:var(--mp-action); background:var(--mp-action); color:var(--mp-on-action); }
    #meal-swap-preview .mp-primary:disabled { opacity:.4; }
    #meal-swap-preview .mp-closed { max-width:700px; margin:auto; padding:30px; text-align:center; background:var(--mp-paper); border:1px solid var(--mp-line); border-radius:14px; }
    #meal-swap-preview .mp-closed p { margin:0 0 18px; }
    @media (max-width:520px) {
      #meal-swap-preview { padding:16px 8px; }
      #meal-swap-preview .mp-head { padding:20px 18px 18px; }
      #meal-swap-preview h2 { font-size:25px; }
      #meal-swap-preview .mp-body { padding:0 18px 20px; }
      #meal-swap-preview .mp-choices { grid-template-columns:1fr; gap:10px; }
      #meal-swap-preview .mp-choice { display:grid; grid-template-columns:96px 1fr; align-items:center; }
      #meal-swap-preview .mp-photo { aspect-ratio:1/1; }
      #meal-swap-preview .mp-name { padding:12px; font-size:18px; }
      #meal-swap-preview .mp-picked { right:auto; left:5px; top:5px; font-size:10px; }
      #meal-swap-preview .mp-footer { padding:17px 18px; gap:12px; }
      #meal-swap-preview .mp-selection { flex-basis:100%; }
      #meal-swap-preview .mp-actions { width:100%; }
      #meal-swap-preview .mp-actions .mp-button { flex:1; }
      #meal-swap-preview .mp-close { width:38px; height:38px; }
    }
    @media (pointer:coarse) { #meal-swap-preview .mp-close { min-width:44px; min-height:44px; } }
  </style>
  <section class="mp-dialog" role="dialog" aria-labelledby="mp-picker-title" aria-describedby="mp-picker-description">
    <div class="mp-head">
      <div class="mp-heading">
        <p class="mp-eyebrow">From your saved menu</p>
        <h2 id="mp-picker-title">Choose a replacement</h2>
        <p id="mp-picker-description" class="mp-subtitle">Replacing <strong>Tomato pasta</strong></p>
      </div>
      <button type="button" class="mp-close cursor-interaction" aria-label="Close recipe picker"><i data-lucide="x" aria-hidden="true"></i></button>
    </div>
    <div class="mp-body">
      <label class="mp-search-label" for="mp-search">Search saved recipes</label>
      <div class="mp-search-wrap">
        <i data-lucide="search" class="mp-search-icon" aria-hidden="true"></i>
        <input id="mp-search" class="mp-search" type="search" placeholder="Search recipe titles…" autocomplete="off" spellcheck="false" aria-controls="mp-recipe-results" aria-describedby="mp-recipe-count">
      </div>
      <div class="mp-results-bar"><p class="mp-hint">Recipes already in your plan are hidden.</p><p id="mp-recipe-count" class="mp-count" aria-live="polite">3 recipes</p></div>
      <div id="mp-recipe-results" class="mp-choices" role="group" aria-label="Replacement recipes">
        <button type="button" class="mp-choice cursor-interaction" aria-pressed="false" data-recipe="Vegetable curry">
          <span class="mp-photo"><img src="https://cdn.jsdelivr.net/gh/iamshaunjp/tailwind-tutorial@lesson-19/public/img/curry.jpg" alt="" referrerpolicy="no-referrer" width="400" height="300"></span>
          <span class="mp-name">Vegetable curry</span><span class="mp-picked" aria-hidden="true">Selected</span>
        </button>
        <button type="button" class="mp-choice cursor-interaction" aria-pressed="false" data-recipe="Sesame noodles">
          <span class="mp-photo"><img src="https://cdn.jsdelivr.net/gh/iamshaunjp/tailwind-tutorial@lesson-19/public/img/noodles.jpg" alt="" referrerpolicy="no-referrer" width="400" height="300"></span>
          <span class="mp-name">Sesame noodles</span><span class="mp-picked" aria-hidden="true">Selected</span>
        </button>
        <button type="button" class="mp-choice cursor-interaction" aria-pressed="false" data-recipe="Hearty bean stew">
          <span class="mp-photo"><img src="https://cdn.jsdelivr.net/gh/iamshaunjp/tailwind-tutorial@lesson-19/public/img/stew.jpg" alt="" referrerpolicy="no-referrer" width="400" height="300"></span>
          <span class="mp-name">Hearty bean stew</span><span class="mp-picked" aria-hidden="true">Selected</span>
        </button>
      </div>
      <div class="mp-empty" hidden>
        <p class="mp-empty-title">No recipes found</p>
        <p class="mp-empty-copy">Try another recipe title.</p>
        <button class="mp-button mp-clear cursor-interaction" type="button">Clear search</button>
      </div>
    </div>
    <div class="mp-footer">
      <p class="mp-selection" aria-live="polite">Choose a recipe to suggest.</p>
      <div class="mp-actions"><button class="mp-button mp-cancel cursor-interaction" type="button">Cancel</button><button class="mp-button mp-primary cursor-interaction" type="button" disabled>Suggest swap</button></div>
    </div>
  </section>
  <div class="mp-closed" hidden><p class="mp-result" aria-live="polite">Recipe picker closed.</p><button class="mp-button mp-primary mp-reopen cursor-interaction" type="button">Suggest a swap</button></div>
  <script>
    (() => {
      const root = document.getElementById('meal-swap-preview');
      const panel = root.querySelector('.mp-dialog');
      const closed = root.querySelector('.mp-closed');
      const choices = [...root.querySelectorAll('.mp-choice')];
      const action = root.querySelector('.mp-actions .mp-primary');
      const status = root.querySelector('.mp-selection');
      const search = root.querySelector('.mp-search');
      const count = root.querySelector('.mp-count');
      const empty = root.querySelector('.mp-empty');
      const normalize = value => value.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLocaleLowerCase().replace(/\s+/g, ' ').trim();
      let selected = null;
      function render() {
        const query = normalize(search.value);
        const visible = choices.filter(choice => normalize(choice.dataset.recipe).includes(query));
        if (!visible.some(choice => choice.dataset.recipe === selected)) selected = null;
        choices.forEach(choice => { choice.hidden = !visible.includes(choice); choice.setAttribute('aria-pressed', String(choice.dataset.recipe === selected)); });
        count.textContent = visible.length + (visible.length === 1 ? ' recipe' : ' recipes');
        empty.hidden = visible.length > 0;
        action.disabled = !selected;
        status.textContent = selected ? 'Selected: ' + selected : 'Choose a recipe to suggest.';
      }
      function save() {
        if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: { selectedRecipe: selected }, privateContent: { query: search.value } }).catch(() => {});
      }
      function restore(state) {
        search.value = typeof state?.privateContent?.query === 'string' ? state.privateContent.query : '';
        const value = state?.modelContent?.selectedRecipe;
        selected = choices.some(choice => choice.dataset.recipe === value) ? value : null;
        render();
      }
      function dismiss(message) {
        panel.hidden = true; closed.hidden = false;
        root.querySelector('.mp-result').textContent = message;
        root.querySelector('.mp-reopen').focus();
      }
      choices.forEach(choice => choice.addEventListener('click', () => { selected = choice.dataset.recipe; render(); save(); }));
      search.addEventListener('input', () => { render(); save(); });
      root.querySelector('.mp-clear').addEventListener('click', () => { search.value = ''; render(); save(); search.focus(); });
      root.querySelector('.mp-close').addEventListener('click', () => dismiss('Recipe picker closed.'));
      root.querySelector('.mp-cancel').addEventListener('click', () => dismiss('No swap suggested.'));
      action.addEventListener('click', () => { if (selected) dismiss('Preview suggestion: ' + selected); });
      root.querySelector('.mp-reopen').addEventListener('click', () => { closed.hidden = true; panel.hidden = false; render(); choices[0].focus(); });
      root.addEventListener('keydown', event => { if (event.key === 'Escape' && !panel.hidden) dismiss('Recipe picker closed.'); });
      window.addEventListener('openai:set_globals', event => { if (Object.prototype.hasOwnProperty.call(event.detail?.globals || {}, 'widgetState')) restore(event.detail.globals.widgetState); });
      restore(window.openai?.widgetState);
    })();
  </script>
</div>

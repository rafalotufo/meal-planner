version: 1
max_turns: 8
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: weekly-meal-planning-implementation
human_gates: [code_owner_approve, release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: { role: product-manager, action: accept_weekly_meal_planning_intent, next: design }
  design: { role: architect, action: specify_and_plan_weekly_meal_planning, next: plan_review }
  plan_review: { role: reviewer, action: approve_weekly_meal_planning_plan, next: build }
  build: { role: senior-developer, action: implement_and_verify_weekly_meal_planning, next: security }
  security: { role: security-researcher, action: assess_weekly_meal_planning_security, next: review }
  review: { role: reviewer, action: verify_weekly_meal_planning, next: done }
  done: { role: null, action: null, next: null }

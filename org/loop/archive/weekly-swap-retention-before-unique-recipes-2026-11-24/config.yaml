version: 1
max_turns: 6
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: weekly-plan-swap-retention-implementation
human_gates: [code_owner_approve, release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: { role: reviewer, action: approve_swap_retention_amendment, next: build }
  build: { role: senior-developer, action: preserve_other_recipe_suggestions, next: security }
  security: { role: security-researcher, action: assess_swap_retention_security, next: review }
  review: { role: reviewer, action: verify_swap_retention, next: done }
  done: { role: null, action: null, next: null }

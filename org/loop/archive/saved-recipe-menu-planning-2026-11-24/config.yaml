# Build planning after owner-approved specification and visual Design.
version: 1
max_turns: 4
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: intent/saved-recipe-menu/plan.md
human_gates: [engineer_approve, code_owner_approve, release_authorization]
acceptance:
  commands: ["python3 -m unittest discover -s tests", "git diff --check"]
phases:
  intent: { role: senior-developer, action: plan_menu_build, next: security }
  security: { role: security-researcher, action: assess_menu_build_plan, next: plan_review }
  plan_review: { role: reviewer, action: review_menu_build_plan, next: awaiting_plan_approval }
  awaiting_plan_approval: { role: null, action: null, next: null }
  done: { role: null, action: null, next: null }

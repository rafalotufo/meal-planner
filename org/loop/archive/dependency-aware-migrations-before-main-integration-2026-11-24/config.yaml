version: 1
max_turns: 8
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: dependency-aware-migrations-implementation
human_gates: [code_owner_approve, release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: { role: architect, action: design_and_prototype, next: design_review }
  design_review: { role: reviewer, action: review_design_plan, next: implement }
  implement: { role: senior-developer, action: implement_and_verify, next: security }
  security: { role: security-researcher, action: assess, next: review }
  review: { role: reviewer, action: review, next: done }
  done: { role: null, action: null, next: null }

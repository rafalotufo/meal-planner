version: 1
max_turns: 4
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: weekly-plan-header-implementation
human_gates: [code_owner_approve, release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: { role: reviewer, action: approve_undated_plan_header, next: build }
  build: { role: senior-developer, action: remove_plan_header_dates, next: review }
  review: { role: reviewer, action: verify_undated_plan_header, next: done }
  done: { role: null, action: null, next: null }

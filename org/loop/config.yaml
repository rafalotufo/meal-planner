# Owner-requested visual Design round after explicit specification approval.
version: 1
max_turns: 4
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: intent/saved-recipe-menu/visual-design.md
human_gates: [visual_design_approval, engineer_approve, code_owner_approve, release_authorization]
acceptance:
  commands: ["python3 -m unittest discover -s tests", "git diff --check"]
phases:
  intent: { role: architect, action: create_page_mockups, next: visual_review }
  visual_review: { role: reviewer, action: review_page_mockups, next: awaiting_visual_approval }
  awaiting_visual_approval: { role: architect, action: add_removal_confirmation, next: confirmation_review }
  confirmation_review: { role: reviewer, action: review_removal_confirmation, next: awaiting_owner_visual_review }
  awaiting_owner_visual_review: { role: null, action: null, next: null }
  done: { role: null, action: null, next: null }

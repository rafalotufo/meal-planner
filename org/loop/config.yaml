version: 1
max_turns: 6
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: dependency-aware-migrations-main-integration
human_gates: [release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: {role: reviewer, action: approve_integration_plan, next: implement}
  implement: {role: senior-developer, action: integrate_and_verify, next: code_review}
  code_review: {role: reviewer, action: review_integration_source, next: local_adoption}
  local_adoption: {role: orchestrator, action: merge_and_restart_local, next: review}
  review: {role: reviewer, action: review, next: done}
  done: {role: null, action: null, next: null}

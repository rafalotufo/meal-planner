version: 1
max_turns: 6
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: agent-verification-main-integration
human_gates: [release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: {role: senior-developer, action: integrate_and_verify, next: security}
  implement: {role: senior-developer, action: integrate_and_verify, next: security}
  security: {role: security-researcher, action: review_combined_source, next: review}
  review: {role: reviewer, action: review, next: done}
  done: {role: null, action: null, next: null}

version: 1
max_turns: 6
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: searchable-swap-picker-retained-results
human_gates: [code_owner_approve, release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: { role: reviewer, action: approve_retained_results_change, next: build }
  build: { role: senior-developer, action: retain_search_results, next: security }
  security: { role: security-researcher, action: assess_retained_results, next: review }
  review: { role: reviewer, action: verify_retained_results, next: done }
  done: { role: null, action: null, next: null }

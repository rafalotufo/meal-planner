# Approved Build in three tested increments, then independent security/code reviews.
version: 1
max_turns: 8
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: saved-recipe-menu-implementation
human_gates: [code_owner_approve, release_authorization]
# Application checks are recorded per changed increment in verification.md and
# independently reviewed; do not repeat unchanged full suites on every audit turn.
acceptance:
  commands: ["python3 -m unittest discover -s tests", "git diff --check"]
phases:
  intent: { role: senior-developer, action: implement_menu_foundation, next: backend }
  backend: { role: senior-developer, action: implement_menu_store_and_http, next: frontend }
  frontend: { role: senior-developer, action: implement_menu_ui_and_verify, next: security }
  security: { role: security-researcher, action: assess_menu_implementation, next: code_review }
  code_review: { role: reviewer, action: review_menu_implementation, next: awaiting_merge_approval }
  implement: { role: senior-developer, action: fix_menu_review_findings, next: security }
  awaiting_merge_approval: { role: null, action: null, next: null }
  done: { role: null, action: null, next: null }

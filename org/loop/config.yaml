# Owner-requested documentation-only release process amendment.
version: 1
max_turns: 4
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: staging-first-release-docs
human_gates: [code_owner_approve, release_authorization]
acceptance:
  commands: ["python3 -m unittest discover -s tests", "git diff --check"]
phases:
  intent: { role: architect, action: specify_staging_first_release, next: plan_review }
  plan_review: { role: reviewer, action: review_process_plan, next: documents }
  documents: { role: senior-developer, action: update_release_documents, next: review }
  review: { role: reviewer, action: verify_release_process, next: done }
  done: { role: null, action: null, next: null }

version: 1
max_turns: 8
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: shared-site-layout-implementation
human_gates: [code_owner_approve, release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: { role: product-manager, action: accept_shared_layout_intent, next: design }
  design: { role: architect, action: specify_and_plan_shared_layout, next: plan_review }
  plan_review: { role: reviewer, action: approve_shared_layout_plan, next: build }
  build: { role: senior-developer, action: implement_and_verify_shared_layout, next: security }
  security: { role: security-researcher, action: assess_shared_layout_security, next: review }
  review: { role: reviewer, action: verify_shared_layout, next: done }
  done: { role: null, action: null, next: null }

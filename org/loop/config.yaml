# Separate owner-authorized Preview-only operation, preserving completed local Build.
version: 1
max_turns: 4
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: vercel-candidate-validation-hosted-setup
human_gates: [release_authorization]
acceptance:
  commands: ["python3 -m unittest discover -s tests", "git diff --check"]
phases:
  intent: { role: architect, action: scope_preview_setup, next: scope_review }
  scope_review: { role: reviewer, action: review_preview_scope, next: configure }
  configure: { role: senior-developer, action: configure_and_deploy_preview, next: review }
  review: { role: reviewer, action: verify_preview_setup, next: done }
  done: { role: null, action: null, next: null }

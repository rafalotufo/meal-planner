version: 1
max_turns: 8
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: weekly-plan-unique-recipes-implementation
human_gates: [code_owner_approve, release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: { role: product-manager, action: accept_unique_weekly_recipes, next: design }
  design: { role: architect, action: specify_unique_weekly_recipes, next: plan_review }
  plan_review: { role: reviewer, action: approve_unique_weekly_recipes, next: build }
  build: { role: senior-developer, action: implement_unique_weekly_recipes, next: security }
  security: { role: security-researcher, action: assess_unique_weekly_recipes_security, next: review }
  review: { role: reviewer, action: verify_unique_weekly_recipes, next: done }
  done: { role: null, action: null, next: null }

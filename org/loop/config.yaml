version: 1
max_turns: 8
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: recipe-url-menu-implementation
human_gates: [product_owner_accept, product_owner_approve, engineer_approve, code_owner_approve, release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: { role: product-manager, action: review_recipe_url_menu_intent, next: design }
  design: { role: architect, action: specify_recipe_url_menu, next: spec_review }
  spec_review: { role: reviewer, action: review_recipe_url_menu_spec, next: planning }
  planning: { role: senior-developer, action: plan_recipe_url_menu, next: plan_review }
  plan_review: { role: reviewer, action: review_recipe_url_menu_plan, next: build }
  build: { role: senior-developer, action: implement_recipe_url_menu, next: security }
  security: { role: security-researcher, action: assess_recipe_url_menu, next: review }
  review: { role: reviewer, action: verify_recipe_url_menu, next: done }
  done: { role: null, action: null, next: null }

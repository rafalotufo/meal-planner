version: 1
max_turns: 6
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: recipe-classification-dropdown-only-implementation
human_gates: [code_owner_approve, staging_acceptance, release_authorization]
acceptance:
  commands: ["git diff --check"]
phases:
  intent: {role: senior-developer, action: refine_presentation_plan, next: design_review}
  design_review: {role: reviewer, action: review_presentation_plan, next: implement}
  implement: {role: senior-developer, action: implement_and_verify, next: review}
  review: {role: reviewer, action: review, next: done}
  done: {role: null, action: null, next: null}

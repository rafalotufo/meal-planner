# New Design run after the owner selected isolated staging; options run preserved.
# Peer review evaluates the draft specification; human spec approval precedes Build.
version: 1
max_turns: 6
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: intent/vercel-candidate-validation/spec.md
human_gates: [product_owner_approve, engineer_approve, code_owner_approve, release_authorization]
acceptance:
  commands: ["python3 -m unittest discover -s tests"]
phases:
  intent: { role: product-manager, action: accept_isolated_staging_intent, next: design }
  design: { role: architect, action: specify_isolated_staging, next: security }
  security: { role: security-researcher, action: assess_staging_design, next: spec_review }
  spec_review: { role: reviewer, action: review_staging_spec, next: awaiting_spec_approval }
  awaiting_spec_approval: { role: null, action: null, next: null }
  done: { role: null, action: null, next: null }

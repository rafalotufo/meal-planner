# Live org state: which agents are busy/idle and what is in the review queue.
# Agents update this file when they accept or finish work; reviewers accept
# reviews only when idle. Commit status changes with the artifact they describe.
version: 1
agents:
  orchestrator: { status: busy, assignment: intent/recipe-photos/intent.md, last_report: Six-turn recipe-search agent loop solved; verified local branch awaits human merge/release. }
  product-manager: { status: idle, assignment: null, last_report: Recipe-photos intent accepted; source-backed larger photos and explicit safe retrieval design required. }
  architect: { status: busy, assignment: intent/recipe-photos/spec.md, last_report: Recipe-search spec independently approved after evidence-binding and empty-result fixes. }
  senior-developer: { status: idle, assignment: null, last_report: "Recipe-search complete locally;34 TypeScript tests and all checks pass, live browser/source sample verified." }
  security-researcher: { status: idle, assignment: null, last_report: Targeted security review003 clear; native citation authority and direct-origin probes pass. }
  reviewer: { status: idle, assignment: null, last_report: Recipe-search final code review002 approved; no unresolved findings. }
  memory-keeper: { status: idle, assignment: null, last_report: null }
review_queue:
  - { id: spec-home-page-001, artifact: spec.md, writer: architect, reviewer: reviewer, rounds: 0, verdict: approved, status: approved }
  - { id: plan-home-page-001, artifact: plan.md, writer: senior-developer, reviewer: reviewer, rounds: 0, verdict: approved, status: approved }
  - { id: plan-home-page-002, artifact: intent/home-page/plan.md, writer: senior-developer, reviewer: reviewer, rounds: 0, verdict: approved, status: approved }
  - { id: code-home-page-001, artifact: implementation, writer: senior-developer, reviewer: reviewer, rounds: 0, verdict: approved, status: approved }
  - { id: spec-recipe-search-001, artifact: intent/recipe-search/spec.md, writer: architect, reviewer: reviewer, rounds: 1, verdict: changes, status: changes_requested }
  - { id: spec-recipe-search-002, artifact: intent/recipe-search/spec.md, writer: architect, reviewer: reviewer, rounds: 1, verdict: approved, status: approved }
  - { id: plan-recipe-search-001, artifact: intent/recipe-search/plan.md, writer: senior-developer, reviewer: reviewer, rounds: 0, verdict: approved, status: approved }
  - { id: plan-recipe-search-002, artifact: intent/recipe-search/plan.md, writer: senior-developer, reviewer: reviewer, rounds: 0, verdict: approved, status: approved }
  - { id: code-recipe-search-001, artifact: recipe-search-implementation, writer: senior-developer, reviewer: reviewer, rounds: 1, verdict: changes, status: changes_requested }
  - { id: code-recipe-search-002, artifact: recipe-search-implementation, writer: senior-developer, reviewer: reviewer, rounds: 1, verdict: approved, status: approved }

version: 1
max_turns: 6
max_no_progress: 2
max_review_rounds: 2
require_security_clear: true
review_artifact: app-icon-implementation
human_gates: [code_owner_approve, release_authorization]
# Full verification is recorded during build; loop runs workflow integrity checks.
acceptance:
  commands: ["python3 -m unittest discover -s tests"]
phases:
  intent: { role: product-manager, action: review_intent, next: design }
  design: { role: architect, action: draft_design, next: design_review }
  design_review: { role: reviewer, action: review_design, next: implement }
  implement: { role: senior-developer, action: implement, next: security }
  security: { role: security-researcher, action: assess, next: review }
  review: { role: reviewer, action: review, next: done }
  done: { role: null, action: null, next: null }

# Staging-first release process amendment; no deployment authorized by this graph.
version: 1
nodes:
  intent:
    stage: "plan"
    artifact: "intent/staging-first-release/intent.md"
    gate: "product_owner_accept"
    status: accepted
    done_status: "accepted"
  spec:
    stage: "design"
    artifact: "intent/staging-first-release/spec.md"
    gate: "product_owner_approve"
    status: approved
    done_status: "approved"
  plan:
    stage: "build"
    artifact: "intent/staging-first-release/plan.md"
    gate: "engineer_approve"
    status: approved
    done_status: "approved"
  implementation:
    stage: "build"
    artifact: "staging-first-release-docs"
    gate: "code_owner_approve"
    status: "in_progress"
    done_status: "merged"
  staging_acceptance:
    stage: "test"
    artifact: "release-specific staging acceptance"
    gate: "staging_acceptance"
    status: "not_started"
    done_status: "approved"
  release:
    stage: "deploy"
    artifact: "authorized staging-first release"
    gate: "release_authorization"
    status: "not_started"
    done_status: "done"
  diagnosis:
    stage: "maintain"
    artifact: "new intent.md"
    gate: "on_call_triage"
    status: "not_started"
    done_status: "done"
edges:
  - {"from": "intent", "to": "spec", "trigger": "acceptance"}
  - {"from": "spec", "to": "plan", "trigger": "approval"}
  - {"from": "plan", "to": "implementation", "trigger": "plan_accepted"}
  - {"from": "implementation", "to": "staging_acceptance", "trigger": "reviewed_release_revision"}
  - {"from": "staging_acceptance", "to": "release", "trigger": "exact_source_staging_accepted"}
  - {"from": "release", "to": "diagnosis", "trigger": "band_breach_or_incident"}
  - {"from": "diagnosis", "to": "intent", "trigger": "written_back"}

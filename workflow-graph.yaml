# Recipe classification under org peer-review and human merge/release gates.
# Prior thumbnail graph/state/history/config preserved in org/loop/archive/plan-recipe-thumbnails-before-recipe-classification/.
version: 1
nodes:
  intent:
    stage: plan
    artifact: intent/recipe-classification/intent.md
    gate: product_manager_review
    status: accepted
    done_status: accepted
  spec:
    stage: design
    artifact: intent/recipe-classification/spec.md
    gate: peer_review
    status: not_started
    done_status: approved
  plan:
    stage: build
    artifact: intent/recipe-classification/plan.md
    gate: peer_review
    status: not_started
    done_status: approved
  implementation:
    stage: build
    artifact: recipe-classification-implementation
    gate: code_owner_approve
    status: not_started
    done_status: merged
  staging_acceptance:
    stage: deploy
    artifact: intent/recipe-classification/staging-validation.md
    gate: staging_acceptance
    status: not_started
    done_status: accepted
  release:
    stage: deploy
    artifact: intent/recipe-classification/release.md
    gate: release_authorization
    status: not_started
    done_status: done
edges:
  - {from: intent, to: spec, trigger: acceptance}
  - {from: spec, to: plan, trigger: approval}
  - {from: plan, to: implementation, trigger: plan_accepted}
  - {from: implementation, to: staging_acceptance, trigger: merge}
  - {from: staging_acceptance, to: release, trigger: acceptance}

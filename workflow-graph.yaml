# Recipe classification under org peer-review and human merge/release gates.
# Prior thumbnail graph/state/history/config preserved in org/loop/archive/plan-recipe-thumbnails-before-classified-weekly-planning/.
version: 1
nodes:
  intent:
    stage: plan
    artifact: intent/classified-weekly-planning/intent.md
    gate: product_manager_review
    status: accepted
    done_status: not_started
  spec:
    stage: design
    artifact: intent/classified-weekly-planning/spec.md
    gate: peer_review
    status: not_started
    done_status: not_started
  plan:
    stage: build
    artifact: intent/classified-weekly-planning/plan.md
    gate: peer_review
    status: not_started
    done_status: not_started
  implementation:
    stage: build
    artifact: classified-weekly-planning-implementation
    gate: code_owner_approve
    status: not_started
    done_status: not_started
  staging_acceptance:
    stage: deploy
    artifact: intent/classified-weekly-planning/staging-validation.md
    gate: staging_acceptance
    status: not_started
    done_status: not_started
  release:
    stage: deploy
    artifact: intent/classified-weekly-planning/release.md
    gate: release_authorization
    status: not_started
    done_status: done
edges:
  - {from: intent, to: spec, trigger: acceptance}
  - {from: spec, to: plan, trigger: approval}
  - {from: plan, to: implementation, trigger: plan_accepted}
  - {from: implementation, to: staging_acceptance, trigger: merge}
  - {from: staging_acceptance, to: release, trigger: acceptance}

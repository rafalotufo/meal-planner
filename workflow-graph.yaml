# Hosted weekly scheduler under org peer-review and human release gates.
version: 1
nodes:
  intent:
    stage: plan
    artifact: intent/weekly-plan-scheduler/intent.md
    gate: product_manager_review
    status: accepted
    done_status: accepted
  spec:
    stage: design
    artifact: intent/weekly-plan-scheduler/spec.md
    gate: peer_review
    status: approved
    done_status: approved
  plan:
    stage: build
    artifact: intent/weekly-plan-scheduler/plan.md
    gate: peer_review
    status: approved
    done_status: approved
  implementation:
    stage: build
    artifact: weekly-plan-scheduler-hosted-target-correction-implementation
    gate: code_owner_approve
    status: pending
    done_status: not_started
  staging_acceptance:
    stage: deploy
    artifact: intent/weekly-plan-scheduler/hosted-target-correction-staging.md
    gate: staging_acceptance
    status: pending
    done_status: accepted
  release:
    stage: deploy
    artifact: intent/weekly-plan-scheduler/hosted-target-correction-release.md
    gate: release_authorization
    status: pending
    done_status: done
edges:
  - {from: intent, to: spec, trigger: acceptance}
  - {from: spec, to: plan, trigger: approval}
  - {from: plan, to: implementation, trigger: plan_accepted}
  - {from: implementation, to: staging_acceptance, trigger: merge}
  - {from: staging_acceptance, to: release, trigger: acceptance}

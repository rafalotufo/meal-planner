# Dependency-aware migrations; owner requests implementation under org peer-review gates.
version: 1
nodes:
  intent: {stage: plan, artifact: intent/dependency-aware-migrations/intent.md, gate: product_manager_review, status: accepted, done_status: accepted}
  spec: {stage: design, artifact: intent/dependency-aware-migrations/spec.md, gate: peer_review, status: approved, done_status: approved}
  plan: {stage: build, artifact: intent/dependency-aware-migrations/hosted-permission-correction.md, gate: peer_review, status: approved, done_status: approved}
  implementation: {stage: build, artifact: dependency-aware-migrations-production-release, gate: code_owner_approve, status: in_progress, done_status: merged}
  staging_acceptance: {stage: test, artifact: intent/dependency-aware-migrations/staging-result.md, gate: staging_acceptance, status: not_started, done_status: approved}
  release: {stage: deploy, artifact: separately authorized release, gate: release_authorization, status: not_started, done_status: done}
edges:
  - {from: intent, to: spec, trigger: acceptance}
  - {from: spec, to: plan, trigger: approval}
  - {from: plan, to: implementation, trigger: plan_accepted}
  - {from: implementation, to: release, trigger: merge}
